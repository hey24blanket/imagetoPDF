<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>이미지 & PDF 맞춤 인쇄기</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <style>
        :root {
            --bg: #F3F4F6;
            --card-bg: #FFFFFF;
            --border: #1F2937;
            --text: #1F2937;
            --primary: #6366F1;
            --accent-green: #D1FAE5;
            --accent-green-text: #065F46;
        }
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
            text-align: center;
            -webkit-tap-highlight-color: transparent;
        }
        h1 {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }
        p.desc {
            color: #4B5563;
            font-size: 13px;
            margin-bottom: 20px;
        }
        
        /* 업로드 박스 (그림자 제거) */
        #drop-zone {
            border: 2px solid var(--border);
            border-radius: 16px;
            padding: 28px 16px;
            background-color: var(--card-bg);
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 16px;
        }
        #drop-zone.dragover {
            background-color: #EEF2FF;
        }
        #drop-zone p {
            margin: 0;
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
        }
        #drop-zone span {
            display: block;
            font-size: 11px;
            color: #6B7280;
            margin-top: 6px;
        }
        
        /* 컨트롤 영역 (그림자 제거) */
        #controls-container {
            display: none; 
            flex-direction: column;
            gap: 14px;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 18px;
            border-radius: 16px;
            border: 2px solid var(--border);
            text-align: left;
        }
        .control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }
        .control-row label {
            font-weight: 700;
            color: var(--text);
            font-size: 13px;
        }
        .control-row .input-area {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        select {
            padding: 8px 12px;
            border-radius: 8px;
            border: 2px solid var(--border);
            font-size: 14px;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            background-color: #fff;
        }

        .slider-container {
            display: flex;
            flex-direction: column;
            width: 160px;
        }
        input[type="range"] {
            width: 100%;
            cursor: pointer;
            margin: 0 0 4px 0;
        }
        .range-labels {
            font-size: 10px;
            color: #6B7280;
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-weight: 600;
        }

        /* 여백 실시간 미니 A4 프리뷰 박스 (항상 1장 세로 기준 고정) */
        .preview-box-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin-top: 6px;
        }
        .mini-page {
            width: 110px;
            height: 155px;
            background: #ffffff;
            border: 2px solid var(--border);
            border-radius: 6px;
            position: relative;
            transition: all 0.2s ease;
        }
        .mini-margin-box {
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            border: 2px dashed var(--primary);
            background: rgba(99, 102, 241, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .mini-slot-label {
            font-size: 9px;
            color: var(--primary);
            font-weight: 800;
            background: rgba(255,255,255,0.9);
            padding: 1px 3px;
            border-radius: 3px;
            border: 1px solid var(--primary);
        }

        /* 메인 다운로드 버튼 (그림자 제거) */
        #generate-btn {
            background-color: var(--accent-green);
            color: var(--accent-green-text);
            border: 2px solid var(--border);
            padding: 14px 20px;
            font-size: 15px;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        #generate-btn:disabled {
            background-color: #E5E7EB;
            color: #9CA3AF;
            cursor: not-allowed;
            display: none;
        }
        
        #preview-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        @media(min-width: 480px) {
            #preview-container {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        /* 카드 컴포넌트 (그림자 제거) */
        .preview-item-wrapper {
            position: relative;
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }
        .preview-img-container {
            width: 100%;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #F9FAFB;
            border-radius: 6px;
            border: 1px solid #E5E7EB;
        }
        .preview-item {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.2s ease;
        }
        .rotate-btn {
            background-color: #F3F4F6;
            color: var(--text);
            border: 2px solid var(--border);
            padding: 6px;
            font-size: 11px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
        }

        .loading-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: none;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 15px;
            font-weight: 700;
            z-index: 999;
            flex-direction: column;
            gap: 12px;
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="loading-overlay" id="loading-overlay">
        <div class="spinner"></div>
        <div id="loading-text">파일을 처리 중입니다...</div>
    </div>

    <h1>이미지 & PDF 맞춤 인쇄기 🎨</h1>
    <p class="desc">가로/세로 어떤 파일이든 A4 용지에 딱 맞춰 변환합니다.</p>

    <input type="file" id="file-input" multiple accept="image/*,application/pdf" style="display: none;">

    <div id="drop-zone">
        <p>📁 이곳을 터치하여 파일 선택</p>
        <span>(JPG, PNG, PDF 등 모든 이미지 및 문서 지원)</span>
    </div>

    <div id="preview-container"></div>

    <div id="controls-container">
        <div class="control-row">
            <label for="layout-select">한장에 인쇄할 그림</label>
            <div class="input-area">
                <select id="layout-select">
                    <option value="1">1장 (세로 단독)</option>
                    <option value="2" selected>2장 (가로 반반)</option>
                    <option value="4">4장 (2x2 격자)</option>
                </select>
            </div>
        </div>

        <div class="control-row">
            <label for="copies-select">인쇄 부수</label>
            <div class="input-area">
                <select id="copies-select"></select>
                <span style="font-weight: 700; font-size: 13px;">부</span>
            </div>
        </div>
        
        <div class="control-row" style="align-items: flex-start; flex-direction: column; gap: 8px;">
            <div style="display: flex; justify-content: space-between; width: 100%; align-items: center;">
                <label for="margin-slider">여백 크기 조절</label>
                <div class="slider-container">
                    <input type="range" id="margin-slider" min="0" max="50" value="15">
                    <div class="range-labels">
                        <span>없음</span>
                        <span>넓게</span>
                    </div>
                </div>
            </div>
            <!-- 여백 미리보기 (항상 1장 세로 기준 단독 표시) -->
            <div class="preview-box-container">
                <div id="mini-page" class="mini-page">
                    <div id="mini-margin-box" class="mini-margin-box">
                        <span class="mini-slot-label">여백 예시</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <button id="generate-btn" disabled>PDF로 다운로드</button>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const previewContainer = document.getElementById('preview-container');
        const controlsContainer = document.getElementById('controls-container');
        const generateBtn = document.getElementById('generate-btn');
        const copiesSelect = document.getElementById('copies-select');
        const layoutSelect = document.getElementById('layout-select');
        const marginSlider = document.getElementById('margin-slider');
        const loadingOverlay = document.getElementById('loading-overlay');
        const loadingText = document.getElementById('loading-text');
        
        const miniMarginBox = document.getElementById('mini-margin-box');

        let uploadedItems = [];

        for (let i = 1; i <= 20; i++) {
            let option = document.createElement('option');
            option.value = i;
            option.innerText = i;
            copiesSelect.appendChild(option);
        }

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => { e.preventDefault(); dropZone.classList.remove('dragover'); handleFiles(e.dataTransfer.files); });
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

        marginSlider.addEventListener('input', updateMiniPreview);

        function updateMiniPreview() {
            const val = parseInt(marginSlider.value, 10);
            const insetPx = (val / 50) * 25; 
            miniMarginBox.style.top = insetPx + 'px';
            miniMarginBox.style.bottom = insetPx + 'px';
            miniMarginBox.style.left = insetPx + 'px';
            miniMarginBox.style.right = insetPx + 'px';
        }

        updateMiniPreview();

        async function handleFiles(files) {
            loadingOverlay.style.display = 'flex';
            loadingText.innerText = '파일을 읽는 중입니다...';

            try {
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    if (file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf')) {
                        await processPdfFile(file);
                    } else {
                        await processImageFile(file);
                    }
                }

                if (uploadedItems.length > 0) {
                    controlsContainer.style.display = 'flex';
                    generateBtn.style.display = 'block';
                    generateBtn.disabled = false;
                }
            } catch (err) {
                console.error(err);
                alert('파일 처리 중 오류가 발생했습니다: ' + err.message);
            } finally {
                loadingOverlay.style.display = 'none';
            }
        }

        function processImageFile(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    addItemToPreview(e.target.result);
                    resolve();
                };
                reader.readAsDataURL(file);
            });
        }

        async function processPdfFile(file) {
            const arrayBuffer = await file.arrayBuffer();
            const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
            const pdfDoc = await loadingTask.promise;

            for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
                const page = await pdfDoc.getPage(pageNum);
                const viewport = page.getViewport({ scale: 2.0 });
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.width = viewport.width;
                canvas.height = viewport.height;

                await page.render({ canvasContext: context, viewport: viewport }).promise;
                addItemToPreview(canvas.toDataURL('image/jpeg', 0.9));
            }
        }

        function addItemToPreview(dataUrl) {
            const itemObj = { dataUrl: dataUrl, rotation: 0 };
            uploadedItems.push(itemObj);

            const wrapper = document.createElement('div');
            wrapper.className = 'preview-item-wrapper';

            const imgContainer = document.createElement('div');
            imgContainer.className = 'preview-img-container';

            const img = new Image();
            img.src = dataUrl;
            img.className = 'preview-item';
            
            imgContainer.appendChild(img);

            const rotateBtn = document.createElement('button');
            rotateBtn.className = 'rotate-btn';
            rotateBtn.innerText = '↺ 90° 회전';
            rotateBtn.onclick = () => {
                itemObj.rotation = (itemObj.rotation + 90) % 360;
                img.style.transform = `rotate(${itemObj.rotation}deg)`;
            };

            wrapper.appendChild(imgContainer);
            wrapper.appendChild(rotateBtn);
            previewContainer.appendChild(wrapper);
        }

        function loadImageElement(dataUrl) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.src = dataUrl;
            });
        }

        async function drawImageIntoSlotWithRotation(ctx, itemObj, cx, cy, slotW, slotH) {
            const img = await loadImageElement(itemObj.dataUrl);
            
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate((itemObj.rotation * Math.PI) / 180);

            let scale;
            const rot = itemObj.rotation % 180;
            if (rot !== 0) {
                scale = Math.min(slotH / img.width, slotW / img.height);
            } else {
                if (img.width > img.height) {
                    scale = Math.min(slotH / img.width, slotW / img.height);
                } else {
                    scale = Math.min(slotW / img.width, slotH / img.height);
                }
            }

            const drawW = img.width * scale;
            const drawH = img.height * scale;

            ctx.drawImage(img, -drawW / 2, -drawH / 2, drawW, drawH);
            ctx.restore();
        }

        generateBtn.addEventListener('click', async () => {
            generateBtn.disabled = true;
            loadingOverlay.style.display = 'flex';
            loadingText.innerText = 'PDF 생성 중...';
            await new Promise(resolve => setTimeout(resolve, 50));

            const copies = parseInt(copiesSelect.value, 10);
            const layout = parseInt(layoutSelect.value, 10);
            const sliderVal = parseInt(marginSlider.value, 10);

            let printQueue = [];
            for (let i = 0; i < uploadedItems.length; i++) {
                for (let c = 0; c < copies; c++) {
                    printQueue.push(uploadedItems[i]);
                }
            }

            const { jsPDF } = window.jspdf;
            let canvas = document.createElement('canvas');
            let ctx = canvas.getContext('2d');

            if (layout === 1) {
                const A4_W = 2100;
                const A4_H = 2970;
                canvas.width = A4_W;
                canvas.height = A4_H;

                const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
                const marginPx = sliderVal * 15; 
                const SLOT_W = A4_W - (marginPx * 2);
                const SLOT_H = A4_H - (marginPx * 2);
                const CX = A4_W / 2;
                const CY = A4_H / 2;

                for (let i = 0; i < printQueue.length; i++) {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, A4_W, A4_H);

                    await drawImageIntoSlotWithRotation(ctx, printQueue[i], CX, CY, SLOT_W, SLOT_H);

                    const canvasDataUrl = canvas.toDataURL('image/jpeg', 0.9);
                    if (i > 0) pdf.addPage();
                    pdf.addImage(canvasDataUrl, 'JPEG', 0, 0, 210, 297);
                }
                pdf.save(`맞춤인쇄_1장씩.pdf`);

            } else if (layout === 2) {
                if (printQueue.length % 2 !== 0) {
                    printQueue.push(printQueue[printQueue.length - 1]);
                }

                const A4_W = 2970;
                const A4_H = 2100;
                canvas.width = A4_W;
                canvas.height = A4_H;

                const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
                const HALF_W = A4_W / 2; 
                const marginPx = sliderVal * 15;
                const SLOT_W = HALF_W - (marginPx * 2); 
                const SLOT_H = A4_H - (marginPx * 2);   
                const LEFT_CX = (HALF_W / 2); 
                const RIGHT_CX = HALF_W + (HALF_W / 2); 
                const CY = A4_H / 2; 

                for (let i = 0; i < printQueue.length; i += 2) {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, A4_W, A4_H);

                    await drawImageIntoSlotWithRotation(ctx, printQueue[i], LEFT_CX, CY, SLOT_W, SLOT_H);
                    if (i + 1 < printQueue.length) {
                        await drawImageIntoSlotWithRotation(ctx, printQueue[i + 1], RIGHT_CX, CY, SLOT_W, SLOT_H);
                    }

                    ctx.beginPath();
                    ctx.setLineDash([30, 20]);
                    ctx.moveTo(HALF_W, 50);
                    ctx.lineTo(HALF_W, A4_H - 50);
                    ctx.strokeStyle = '#9ca3af'; 
                    ctx.lineWidth = 4;
                    ctx.stroke();
                    ctx.setLineDash([]);

                    const canvasDataUrl = canvas.toDataURL('image/jpeg', 0.9);
                    if (i > 0) pdf.addPage();
                    pdf.addImage(canvasDataUrl, 'JPEG', 0, 0, 297, 210);
                }
                pdf.save(`맞춤인쇄_2쪽뽑기.pdf`);

            } else if (layout === 4) {
                while (printQueue.length % 4 !== 0) {
                    printQueue.push(printQueue[printQueue.length - 1]);
                }

                const A4_W = 2100;
                const A4_H = 2970;
                canvas.width = A4_W;
                canvas.height = A4_H;

                const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
                const HALF_W = A4_W / 2;
                const HALF_H = A4_H / 2;
                const marginPx = sliderVal * 15;
                const SLOT_W = HALF_W - (marginPx * 2);
                const SLOT_H = HALF_H - (marginPx * 2);
                const CX1 = HALF_W / 2;
                const CX2 = HALF_W + (HALF_W / 2);
                const CY1 = HALF_H / 2;
                const CY2 = HALF_H + (HALF_H / 2);

                for (let i = 0; i < printQueue.length; i += 4) {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, A4_W, A4_H);

                    await drawImageIntoSlotWithRotation(ctx, printQueue[i], CX1, CY1, SLOT_W, SLOT_H);
                    if (i + 1 < printQueue.length) {
                        await drawImageIntoSlotWithRotation(ctx, printQueue[i + 1], CX2, CY1, SLOT_W, SLOT_H);
                    }
                    if (i + 2 < printQueue.length) {
                        await drawImageIntoSlotWithRotation(ctx, printQueue[i + 2], CX1, CY2, SLOT_W, SLOT_H);
                    }
                    if (i + 3 < printQueue.length) {
                        await drawImageIntoSlotWithRotation(ctx, printQueue[i + 3], CX2, CY2, SLOT_W, SLOT_H);
                    }

                    ctx.beginPath();
                    ctx.setLineDash([30, 20]);
                    ctx.moveTo(HALF_W, 50);
                    ctx.lineTo(HALF_W, A4_H - 50);
                    ctx.moveTo(50, HALF_H);
                    ctx.lineTo(A4_W - 50, HALF_H);
                    ctx.strokeStyle = '#9ca3af';
                    ctx.lineWidth = 4;
                    ctx.stroke();
                    ctx.setLineDash([]);

                    const canvasDataUrl = canvas.toDataURL('image/jpeg', 0.9);
                    if (i > 0) pdf.addPage();
                    pdf.addImage(canvasDataUrl, 'JPEG', 0, 0, 210, 297);
                }
                pdf.save(`맞춤인쇄_4쪽뽑기.pdf`);
            }

            loadingOverlay.style.display = 'none';
            generateBtn.innerText = 'PDF로 다운로드';
            generateBtn.disabled = false;
        });
    </script>
</body>
</html>
